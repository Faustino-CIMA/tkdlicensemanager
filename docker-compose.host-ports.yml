# Optional overlay: publish app + data services on the host for local development.
# Production / Dokploy: omit this file — Traefik and other containers use Docker DNS
# (backend:8000, frontend:3000, db:5432, redis:6379) with no host port binding.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.host-ports.yml up -d
#
# If any port is busy on your machine, change the host side (left of the colon) or
# set BACKEND_BIND_ADDRESS / FRONTEND_BIND_ADDRESS in `.env` (host IP to bind).

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8000:8000"

  frontend:
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:3000"
