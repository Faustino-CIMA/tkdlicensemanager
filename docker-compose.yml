name: ltf-license-manager

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ltf_license_manager}
      POSTGRES_USER: ${POSTGRES_USER:-ltf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ltf_password}
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=${POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      -c log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT_MS:-750}
      -c log_checkpoints=on
      -c log_lock_waits=on
    # No host ports: avoids conflicts on servers where 5432 is already bound (e.g. Dokploy
    # host Postgres). Use docker-compose.host-ports.yml locally if you need localhost:5432.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    command: ["redis-server", "--appendonly", "yes"]
    # No host ports: same rationale as db (see docker-compose.host-ports.yml for local).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        set -e
        sh /app/scripts/check-env.sh
        python manage.py migrate --noinput
        python manage.py check
        python manage.py collectstatic --noinput
        exec gunicorn -c gunicorn.conf.py config.wsgi:application
      "
    volumes:
      - ./backend:/app
      - staticfiles_data:/app/staticfiles
      - mediafiles_data:/app/media
      # .cursor is deliberately NOT mounted to prevent ownership conflicts
    # No host ports: avoids conflicts when another stack uses 8000 (common on Dokploy/VPS).
    # Traefik reaches backend on the internal network. For curl from your laptop, use
    # docker-compose.host-ports.yml.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
    networks:
      - app-net

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 120s
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      sh -c "
        set -e
        python manage.py migrate --check
        exec celery -A config worker -l info -Q celery,\${CELERY_PRINT_JOB_QUEUE:-print_jobs}
      "
    volumes:
      - ./backend:/app
      - mediafiles_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$(hostname) > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - app-net

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_BEAT_SCHEDULE_FILENAME: /var/lib/celerybeat/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: >
      sh -c "
        set -e
        python manage.py migrate --check
        exec celery -A config beat -l info
      "
    volumes:
      - ./backend:/app
      - mediafiles_data:/app/media
      - celerybeat_data:/var/lib/celerybeat
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q \"celery.*beat\" && exit 0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "start", "--", "-p", "3000"]
    # No host ports: same rationale as backend (3000 often taken); use host-ports overlay locally.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:
  staticfiles_data:
  mediafiles_data:
  celerybeat_data:

networks:
  app-net:
    driver: bridge